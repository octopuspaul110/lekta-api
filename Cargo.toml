[package]
name = "lekta_api"
version = "0.1.0"
edition = "2021"
authors = ["Adegbite Paul <padegbite04@gmail.com>"]
rust-version = "1.91"
license = "MIT"
description = "Backend API for Lekta - tutorial center management platform."

[dependencies]
tokio = { version = "1.32.0", features = ["full"] }
axum = { version = "0.8.9", features = ["macros", "ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "timeout", "cors", "limit"] }
tower_governor = "0.4"
hyper = "1.5"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid", "migrate"] }
redis = { version = "0.27", features = ["tokio-comp", "aio", "connection-manager"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.105"
chrono = { version = "0.4.26", features = ["serde"] }
uuid = { version = "1.4.1", features = ["v4", "v7", "serde"] }
argon2 = "0.5.1"
jsonwebtoken = "9.3.0"
sha2 = "0.10.8"
rand = "0.8"
hmac = "0.12"
subtle = "2.5.1"
hex = "0.4.3"
base64 = "0.22.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
aws-config = "1"
aws-sdk-s3 = "1"
aws-sdk-ses = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sentry = "0.34"
sentry-tower = "0.34"
sentry-tracing = "0.34"
tera = "1.20"
validator = { version = "0.20", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
url = "2.5"
dotenvy = "0.15"
once_cell = "1.20"
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
rrule = "0.13"
google-cloud-auth = "0.17"
google-cloud-token = "0.1"
mime = "0.3"
regex = "1"
[dev-dependencies]
tokio-test = "0.4"
reqwest = "0.12"
fake = { version = "3", features = ["chrono", "derive", "uuid"] }
pretty_assertions = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = 1
